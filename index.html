<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tableau de bord">
<title>Tableau de bord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d6a57'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --text:#22211d; --muted:#7a766c; --faint:#a8a397; --line:#e9e4d8; --soft:#efebe1;
  --accent:#2d6a57; --on-accent:#fff; --accent-soft:#e1ece5;
  --mid:#a3720e; --mid-soft:#f5ead1; --warn:#b14f2b; --warn-soft:#f6e1d7;
  --shadow:0 1px 2px rgba(40,35,20,.04),0 4px 14px rgba(40,35,20,.04);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --card:#1b1b19; --text:#ece9e1; --muted:#9d998f; --faint:#6e6b64; --line:#2c2b28; --soft:#25241f;
    --accent:#79c3a9; --on-accent:#0f231c; --accent-soft:#1d3530;
    --mid:#dcb35a; --mid-soft:#382f1d; --warn:#ea8f69; --warn-soft:#3c251b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.has-pill{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:14px 16px 8px}
h1{font:600 28px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
h2{font:600 17px/1.3 var(--serif);margin:0}
h3{font-size:13px;font-weight:600;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:6px 0}
a{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.card.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row.end{justify-content:flex-end;margin-top:6px}
.chead .row,.top .row{flex-wrap:nowrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--muted);font-size:14px;margin:30px 0}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Boutons et champs */
.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 15px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.link{border:0;background:none;padding:6px;color:var(--muted)}
.btn.danger{color:var(--warn)}
.btn.tiny{font-size:12.5px;padding:5px 10px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.icon{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:17px;line-height:1;cursor:pointer;flex:none}
.icon:disabled{opacity:.35}
.x{border:0;background:none;color:var(--faint);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
input[type=text],input[type=password],input[type=date],select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg label,.seg button{flex:1;text-align:center;padding:9px 6px;cursor:pointer;font:inherit;font-size:14px;color:var(--muted);position:relative;border:0;background:none}
.seg>*+*{border-left:1px solid var(--line)!important}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked),.seg button.on{background:var(--card);color:var(--text);font-weight:600}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:6px 13px;cursor:pointer}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}

/* Barres */
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.bar.mid>span{background:var(--mid)}
.bar.over>span{background:var(--warn)}
.bar.sm{height:4px}
.between{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:7px;font-variant-numeric:tabular-nums}

/* Accueil */
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 2px 6px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.bigdate{font:400 38px/1.05 var(--serif);letter-spacing:-.02em;margin-top:4px}
.bigdate b{font-weight:600}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--soft)}
.ring .arc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 18px var(--serif);font-variant-numeric:tabular-nums}
.ring small{font:500 11px var(--sans);color:var(--muted);margin-left:1px}
.brief{list-style:none;margin:0;padding:0}
.brief li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.45}
.brief li+li{border-top:1px solid var(--line)}
.brief .ico{color:var(--accent);margin-top:2px}
.dom{position:relative;display:flex;align-items:center;gap:14px;padding:15px 18px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dom:first-child{border-top:0}
.dom input{position:absolute;opacity:0;pointer-events:none}
.dico{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--muted);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.dom.on .dico{background:var(--accent-soft);color:var(--accent)}
.dtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.dname{font-weight:600}
.dom.on .dname{color:var(--accent)}
.todo{color:var(--warn)}
.box{flex:none;width:26px;height:26px;border:1.6px solid var(--faint);border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s}
.dom.on .box{background:var(--accent);border-color:var(--accent)}
.dom.on .box::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.2px 2.2px 0;transform:translateY(-1px) rotate(45deg)}
.dom.pop .box{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.dom input:focus-visible~.box{outline:2px solid var(--accent);outline-offset:2px}
.streak{text-align:right;flex:none;min-width:44px;font-variant-numeric:tabular-nums}
.streak b{display:block;font:600 19px/1.1 var(--serif)}
.streak small{color:var(--muted);font-size:11px}
.kbd{display:none;font:500 11px var(--sans);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:2px}
@media (hover:hover) and (pointer:fine){ .kbd{display:inline-block} }
.home{display:block}
.home>div>.card:first-child{margin-top:14px}
details.week>summary{display:flex;justify-content:space-between;align-items:center;gap:8px}
details.week>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.week[open]>summary::after{transform:rotate(180deg)}
details.week[open]>summary{margin-bottom:12px}
.wkline{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.wkline .ico{color:var(--accent);margin-top:2px}
.wk{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.wk th{font-size:11px;color:var(--muted);font-weight:500;padding-bottom:2px}
.wk th.now{color:var(--accent);font-weight:700}
.wk .dn{width:64px;text-align:left;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .tot{width:30px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell{display:block;width:100%;height:28px;border-radius:8px;border:0;background:var(--soft);padding:0;cursor:pointer;transition:background .2s}
.cell.on{background:var(--accent)}
.cell.today{box-shadow:inset 0 0 0 1.6px var(--accent)}
.cell:disabled{opacity:.35;cursor:default}
.ngoal{cursor:pointer}

/* Objectifs */
.goal.done{opacity:.6}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.gtitle{font-weight:600}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.mid{background:var(--mid-soft);color:var(--mid)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.inl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.inl input{width:110px}

/* Révisions */
.timer{font:600 52px/1 var(--serif);font-variant-numeric:tabular-nums;text-align:center;margin:8px 0 12px;letter-spacing:-.02em}
.phase{text-align:center;font-size:13px;color:var(--muted)}
.due{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.due:first-of-type{border-top:0}
.due .dt{flex:1;min-width:0;font-size:14px}
.ue summary{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.ue summary .bar{grid-column:1/-1;margin-top:10px}
.uecode{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.uename{font:600 16px/1.3 var(--serif);min-width:0}
.uepct{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ue[open] summary{margin-bottom:12px}
.chaps{list-style:none;margin:0;padding:0}
.chaps li{padding:6px 0;border-top:1px solid var(--line)}
.crow{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.cname{flex:1 1 240px;min-width:0;overflow-wrap:anywhere;font:inherit;font-size:14.5px;text-align:left;background:none;border:0;color:inherit;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
.cname::before{content:"›";color:var(--faint);font-size:16px;transition:transform .15s;flex:none;width:8px}
.chaps li.open .cname::before{transform:rotate(90deg)}
.chaps li.full .cname{color:var(--accent);font-weight:600}
.cbadge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;flex:none}
.cbadge.due{background:var(--mid-soft);color:var(--mid)}
.cbadge.late{background:var(--warn-soft);color:var(--warn)}
.cpanel{margin:4px 0 8px 16px;padding:10px 12px;background:var(--bg);border-radius:12px}
.steps.mini{margin:0;gap:4px}
.steps.mini .step{flex:none;padding:4px 10px;font-size:12.5px}
.addch>summary{display:inline-block;color:var(--accent);font-size:14px;font-weight:500;padding:8px 0}
.revpick{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
@media (max-width:520px){ .revpick{grid-template-columns:1fr} }
.revnow{font-size:14px;color:var(--muted);text-align:center}
.revnow b{color:var(--text)}
.steps{display:flex;gap:6px;margin-top:8px}
.step{font:inherit;font-size:12.5px;flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:6px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.step.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.step.on::before{content:"✓ "}
.jrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.jdate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.jdate input{width:auto;padding:4px 8px;font-size:16px;border-radius:9px}
.jchips{display:flex;gap:4px;flex-wrap:wrap}
.jc{font:inherit;font-size:11.5px;font-weight:600;border:0;border-radius:7px;padding:4px 6px;background:var(--soft);color:var(--faint);cursor:pointer;font-variant-numeric:tabular-nums}
.jc.done{background:var(--accent-soft);color:var(--accent)}
.jc.due{background:var(--mid-soft);color:var(--mid)}
.jc.late{background:var(--warn-soft);color:var(--warn)}
.uelist label{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.uelist label:first-child{border-top:0}
.uelist input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}

/* Budget */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font:600 17px/1.3 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--accent)}
.neg{color:var(--warn)}
.catrow{padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .between{margin:0 0 7px;font-size:14px}
.tx{display:grid;grid-template-columns:42px 1fr auto auto;gap:2px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tx .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.tx .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.tx select{grid-column:2;font-size:16px;padding:3px 6px;width:auto;max-width:100%;border-radius:8px;background:var(--card)}
.editcat{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;padding:6px 0}
.prev{font-size:13px;margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.prev div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.prev span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Graphiques */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{min-height:20px;margin-top:6px}
.gridl{stroke:var(--line);stroke-width:1}
.axl{fill:var(--muted);font:11px var(--sans)}
.axl.b{fill:var(--text);font-weight:600}
.lpath{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.larea{fill:var(--accent);opacity:.09}
.hdot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.bfill{fill:var(--accent)}
.bfill.dim{opacity:.45}
.hit{fill:transparent;cursor:pointer}
.hscroll{overflow-x:auto;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
.hscroll svg{width:auto;height:auto}
.h0{fill:var(--soft)}
.h1,.h2,.h3,.h4,.h5{fill:var(--accent)}
.h1{fill-opacity:.25}.h2{fill-opacity:.45}.h3{fill-opacity:.65}.h4{fill-opacity:.82}
.hlegend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);justify-content:flex-end;margin-top:6px}
.hlegend svg{width:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .v{font:600 22px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.tile.main{background:var(--accent-soft)}
.tile.main .v{color:var(--accent)}
table.mt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.mt th,table.mt td{padding:7px 4px;text-align:center;border-top:1px solid var(--line)}
table.mt th{font-weight:500;color:var(--muted);border-top:0;font-size:12px}
table.mt td:first-child,table.mt th:first-child{text-align:left}

/* Lectures */
.book{padding:12px 0;border-top:1px solid var(--line)}
.book:first-of-type{border-top:0}
.bt{display:flex;gap:8px;align-items:flex-start}
.bt .t{flex:1;min-width:0}
.bt .t b{font-weight:600}
.stars{display:flex;gap:2px}
.star{border:0;background:none;padding:2px;font-size:18px;line-height:1;cursor:pointer;color:var(--line)}
.star.on{color:var(--mid)}

/* Navigation */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);background:color-mix(in oklab,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;max-width:140px;background:none;border:0;padding:9px 2px 10px;color:var(--faint);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:600}
#pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);border:0;border-radius:99px;padding:8px 16px;font:600 13px var(--sans);font-variant-numeric:tabular-nums;z-index:6;display:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#pill.show{display:block}
#toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* PC : menu sur le côté, accueil sur deux colonnes */
@media (min-width:900px){
  body{padding:0 0 32px 210px}
  body.has-pill{padding-bottom:80px}
  main{max-width:760px;padding:20px 32px}
  nav.tabs{top:0;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--line);background:var(--card)}
  nav.tabs::before{content:"Tableau de bord";font:600 18px var(--serif);color:var(--text);padding:0 12px 18px}

/* ---------- Utilitaires ---------- */
const pad = n => String(n).padStart(2, '0');

const shiftMonth = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d, o) => new Intl.DateTimeFormat('fr-FR', o).format(d);

const fmtMonthS = ym => fmt(fromKey(ym + '-01'), { month:'short' }).replace('.', '');
const fmtNum = n => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(n);
const eur = n => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' }).format(n);
const eur0 = n => new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n);
const numIn = n => n == null ? '' : String(n).replace('.', ',');

const fmtMin = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + pad(m % 60) : ''}`;
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };

function parseAmount(s) {
  if (s == null) return NaN;
  s = String(s).replace(/[\s  €]|EUR/gi, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
  if (s.includes(',') && s.includes('.')) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (s.includes(',')) s = s.replace(',', '.');
  if (!/^[+-]?\d*\.?\d+$/.test(s)) return NaN;
  const n = parseFloat(s);
  return neg ? -n : n;
}
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/);

}

/* ---------- Stockage ---------- */
let storageOK = true;
function defaults() {

  let raw = null, d = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }

    try { d = migrate(Object.assign(defaults(), JSON.parse(raw))); }

      try { localStorage.setItem(KEY + '-illisible-' + Date.now(), raw); } catch (_) {}

}

  const def = defaults();

  d.pomo = Object.assign(def.pomo, d.pomo);

  if (!d.chess.auto || typeof d.chess.auto !== 'object') d.chess.auto = {};

    if (c.status != null) { c.fiche = c.status >= 1; c.cards = c.appris = c.status >= 2; delete c.status; }

    if (c.cours == null) c.cours = '';

  if (d.budget.saveGoal == null) d.budget.saveGoal = 0;
  return d;
}
function applySeed(d) {
  if ((d.seed || 0) >= SEED_V) return d;
  d.ue.forEach(u => {
    u.hidden = !SEED_VISIBLE.includes(u.code);
    (SEED[u.id] || []).forEach(([name, fiche, cards]) => {
      const c = u.chapters.find(c => norm(c.name) === norm(name));
      if (c) { c.fiche = c.fiche || !!fiche; c.cards = c.cards || !!cards; }
      else u.chapters.push(newChapter(name, !!fiche, !!cards));

function persist() {

const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), ch => ch.charCodeAt(0)));
const ghFetch = (path, opts = {}) => fetch(`https://api.github.com/repos/${sync.repo}${path}`, Object.assign({ cache: 'no-store' }, opts, {
  headers: Object.assign({ Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json' }, opts.headers || {}),
}));
const ghError = st => st === 401 ? 'Clé refusée par GitHub (expirée ou mal copiée). Crée-en une nouvelle.'
  : st === 403 ? 'La clé n’a pas le droit d’écrire dans le dépôt : il faut la permission « Contents : Read and write ».'
  : st === 404 ? 'Dépôt introuvable : vérifie le nom (pseudo/dépôt) et que la clé a accès à ce dépôt.'
  : `GitHub a répondu une erreur (${st}). Réessaie plus tard.`;
function schedulePush() {
  if (!sync || !sync.on) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncNow, 2500);
}
// Fusion de deux versions (modifiées sur deux appareils entre deux synchros).
// « base » garde ses réglages ; on y ajoute tout ce que « other » a en plus.
function mergeData(base, other) {
  const m = migrate(Object.assign(defaults(), JSON.parse(JSON.stringify(base))));
  const o = migrate(Object.assign(defaults(), JSON.parse(JSON.stringify(other))));
  for (const [d, doms] of Object.entries(o.checks)) m.checks[d] = Object.assign({}, doms, m.checks[d]);
  const addMissing = (dst, src, k) => { const have = new Set(dst.map(i => i[k])); src.forEach(i => { if (!have.has(i[k])) dst.push(i); }); };
  addMissing(m.goals, o.goals, 'id'); addMissing(m.books, o.books, 'id'); addMissing(m.budget.tx, o.budget.tx, 'id');
  addMissing(m.budget.cats, o.budget.cats, 'name');
  const logKey = l => l.id || `${l.d}|${l.ue}|${l.min}`, seen = new Set(m.pomo.log.map(logKey));
  o.pomo.log.forEach(l => { if (!seen.has(logKey(l))) m.pomo.log.push(l); });
  o.ue.forEach(ou => {
    const mu = m.ue.find(u => u.id === ou.id);
    if (!mu) { m.ue.push(ou); return; }
    ou.chapters.forEach(oc => {
      const mc = mu.chapters.find(c => norm(c.name) === norm(oc.name));
      if (!mc) { mu.chapters.push(oc); return; }

      if (!mc.cours && oc.cours) { mc.cours = oc.cours; mc.j = oc.j.slice(); }
      else if (mc.cours && mc.cours === oc.cours) mc.j = mc.j.map((v, i) => v || oc.j[i]);
    });
  });
  for (const [k, r] of Object.entries(o.reviews)) if (!m.reviews[k] || (m.reviews[k].skipped && !r.skipped)) m.reviews[k] = r;
  const hist = {};
  [...o.chess.hist, ...m.chess.hist].forEach(e => { hist[e.d] = { d: e.d, r: Object.assign({}, hist[e.d] ? hist[e.d].r : {}, e.r) }; });
  m.chess.hist = Object.values(hist).sort((a, b) => a.d < b.d ? -1 : 1);
  if (!m.chess.user && o.chess.user) Object.assign(m.chess, { site: o.chess.site, user: o.chess.user, main: o.chess.main });

async function syncNow(attempt = 0) {
  if (!sync || !sync.on) return;
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) { sync.err = 'Hors ligne : la synchro reprendra au retour d’internet.'; saveSync(); return; }
  clearTimeout(pushTimer);
  syncing = true;
  let changedLocal = false, retry = false;
  try {
    let res = await ghFetch(`/contents/${SYNC_FILE}`);
    let remote = null, sha = null;
    if (res.ok) { const j = await res.json(); sha = j.sha; remote = JSON.parse(b64dec(j.content)); }
    else if (res.status !== 404) throw new Error(ghError(res.status));
    const localDirty = (S.meta.modified || 0) > (sync.syncedAt || 0);
    const remoteChanged = !!remote && sha !== sync.sha;
    let mustPush = !remote || localDirty;
    if (remoteChanged) {
      const remoteMod = (remote.meta && remote.meta.modified) || 0;
      if (!sync.sha) { S = mergeData(remote, S); mustPush = true; }                        // 1re synchro de cet appareil
      else if (localDirty) { S = (S.meta.modified || 0) >= remoteMod ? mergeData(S, remote) : mergeData(remote, S); mustPush = true; }
      else { S = migrate(Object.assign(defaults(), remote)); mustPush = false; }          // rien de neuf ici : on prend la version en ligne
      persist(); changedLocal = true;
    }
    if (mustPush) {
      const body = { message: `Synchro du ${new Date().toLocaleString('fr-FR')}`, content: b64enc(JSON.stringify(S)) };
      if (sha) body.sha = sha;
      const sentMod = S.meta.modified;
      res = await ghFetch(`/contents/${SYNC_FILE}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if ((res.status === 409 || res.status === 422) && attempt < 2) { retry = true; return; }   // modifié ailleurs entre-temps : on recommence
      if (!res.ok) throw new Error(ghError(res.status));
      sha = (await res.json()).content.sha;
      sync.syncedAt = sentMod;
    } else sync.syncedAt = S.meta.modified;
    sync.sha = sha; sync.last = Date.now(); sync.err = '';
  } catch (e) {
    sync.err = e instanceof TypeError ? 'Connexion à GitHub impossible — vérifie ta connexion internet.' : (e.message || 'Synchro impossible');
  } finally {
    syncing = false; saveSync();
    if (retry) syncNow(attempt + 1);
    else {
      if (changedLocal || (ui.tab === 'plus' && ui.plus === 'data')) renderSoon();
      // Modifications faites pendant la synchro : on renvoie (sauf en cas d'erreur, pour ne pas boucler)
      if (sync && !sync.err && (syncAgain || (S.meta.modified || 0) > (sync.syncedAt || 0))) schedulePush();
      syncAgain = false;
    }
  }
}

function weekCard() {

/* ---------- Rendu : Objectifs ---------- */
const goalById = id => S.goals.find(g => g.id === id);
function goalState(g) {
  const hasT = g.target != null;
  let pct = null;
  if (hasT) {
    const st = g.start || 0;
    pct = g.target === st ? 100 : Math.max(0, Math.min(100, (g.current - st) / (g.target - st) * 100));
  }
  return { hasT, pct, done: !!g.done || (hasT && pct >= 100) };
}
function goalBadge(g, st) {
  if (st.done) return `<span class="badge ok">Atteint</span>`;
  if (!g.deadline) return '';
  const dd = dayDiff(fromKey(g.deadline), today());
  return dd < 0 ? `<span class="badge warn">En retard de ${-dd} j</span>`
       : dd === 0 ? `<span class="badge warn">Aujourd’hui</span>`
       : `<span class="badge ${dd <= 7 ? 'mid' : ''}">J-${dd}</span>`;
}
function goalHTML(g) {

    const span = dayDiff(fromKey(g.deadline), fromKey(g.created)), el = dayDiff(today(), fromKey(g.created));
    if (span > 0 && el >= 0) {
      const expected = Math.min(100, el / span * 100);
      pace = pct + 0.5 >= expected ? `<span class="pos">Dans les temps</span>` : `<span class="neg">En retard sur le rythme (${Math.round(expected)} % attendu)</span>`;

  const auto = /elo/i.test(g.unit || '') && S.chess.user;
  return `<article class="card goal${done ? ' done' : ''}">

    ${hasT ? `
      <div class="bar"><span style="width:${pct}%"></span></div>
      <div class="between"><span>${fmtNum(g.current)} / ${fmtNum(g.target)} ${esc(g.unit)}</span><span>${Math.round(pct)} %</span></div>
      ${pace ? `<div class="sub" style="margin-top:4px">${pace}</div>` : ''}

             : `<div class="row"><label class="inl">Valeur actuelle <input type="text" inputmode="decimal" value="${numIn(g.current)}" data-change="goalCur" data-id="${g.id}"></label></div>`}`
    : `<label class="chk"><input type="checkbox" data-change="goalDone" data-id="${g.id}" ${g.done ? 'checked' : ''}> Objectif atteint</label>`}

/* ---------- Pomodoro ---------- */
function beep() {
  try {
    const ctx = ui.audio;
    if (ctx) [0, .3, .6].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + t;
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.2, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
      o.start(t0); o.stop(t0 + .25);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function ensureAudio() {
  try {
    if (!ui.audio) ui.audio = new (window.AudioContext || window.webkitAudioContext)();
    if (ui.audio.state === 'suspended') ui.audio.resume();
  } catch (e) {}
}
// Fin d'une phase. Si la page était fermée, la session est comptée au jour où elle s'est terminée
// et la pause est sautée si elle est déjà écoulée.
function finishPhase() {
  const tm = S.timer, now = Date.now();
  if (tm.phase === 'work') {
    const day = key(new Date(tm.endAt));
    S.pomo.log.push({ id: uid(), d: day, ue: tm.ue, chap: tm.chap || '', min: S.pomo.work });
    setCheck(day, 'ecole', true);
    const breakEnd = tm.endAt + S.pomo.brk * 60000;
    if (breakEnd <= now) {
      S.timer = null;
      toast(`Session de ${S.pomo.work} min comptée`);
    } else {
      S.timer = { phase: 'break', ue: tm.ue, chap: tm.chap, endAt: breakEnd, paused: false };
      toast(`Session terminée (${S.pomo.work} min) · pause de ${S.pomo.brk} min`);
      beep();
    }
  } else {
    S.timer = null;
    toast('Pause terminée — prêt pour une nouvelle session ?');
    if (now - tm.endAt < 60000) beep();
  }
  save(); render();
}
// Passage à un nouveau jour alors que la page est ouverte
function newDay() {
  const old = ui.day;
  ui.day = key(today()); ui.week = 0;
  if (ui.month === old.slice(0, 7)) ui.month = ui.day.slice(0, 7);
  render();
}
function tick() {
  if (key(today()) !== ui.day) { newDay(); return; }
  const tm = S.timer, pill = document.getElementById('pill');
  if (!tm) { pill.classList.remove('show'); document.body.classList.remove('has-pill'); return; }
  const left = tm.paused ? tm.remain : tm.endAt - Date.now();
  if (!tm.paused && left <= 0) { finishPhase(); return; }
  pill.textContent = `${tm.phase === 'work' ? '● Focus' : 'Pause'} · ${mmss(left)}${tm.paused ? ' (en pause)' : ''}`;
  pill.classList.toggle('show', ui.tab !== 'today');
  document.body.classList.toggle('has-pill', ui.tab !== 'today');
  document.querySelectorAll('[data-timer]').forEach(e => { e.textContent = mmss(left); });
  const total = (tm.phase === 'work' ? S.pomo.work : S.pomo.brk) * 60000;
  document.querySelectorAll('[data-timer-bar]').forEach(e => { e.style.width = Math.min(100, 100 - left / total * 100) + '%'; });
}

/* ---------- Rendu : Budget ---------- */
function catSelect(name, selected, attrs = '') {
  const names = S.budget.cats.map(c => c.name);
  if (selected && !names.includes(selected)) names.push(selected);   // catégorie venue d'une sauvegarde
  return `<select name="${name}" ${attrs}>${names.map(n => `<option ${n === selected ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
}
function monthTotals(ym) {
  let dep = 0, rev = 0, ep = 0;
  const cats = {};
  S.budget.tx.forEach(t => {
    if (!t.date.startsWith(ym)) return;
    if (t.amount > 0) rev += t.amount; else { dep -= t.amount; if (t.cat === 'Épargne') ep -= t.amount; }
    if (t.cat !== 'Revenus') cats[t.cat] = (cats[t.cat] || 0) - t.amount;
  });
  return { dep, rev, ep, cats };
}
function budgetStats() {
  if (!S.budget.tx.length && !S.budget.saveGoal) return '';
  const months = [...Array(6)].map((_, i) => shiftMonth(ui.month, i - 5));
  const tots = months.map(monthTotals);
  let h = `<section class="card"><h2 style="margin-bottom:12px">Tendance sur 6 mois</h2>` +
    barChart(months.map((m, i) => ({ label: fmtMonthS(m), v: tots[i].dep, cur: m === ui.month, tip: `${fmtMonth(m)} : ${eur(tots[i].dep)} dépensés · ${eur(tots[i].rev)} de revenus` })), 'Dépenses des 6 derniers mois');
  // Catégorie en hausse : mois affiché vs moyenne des 3 précédents
  const cur = tots[5].cats, prev = tots.slice(2, 5);
  let up = null;
  Object.keys(cur).forEach(c => {
    const avg = prev.reduce((s, t) => s + Math.max(0, t.cats[c] || 0), 0) / 3, diff = cur[c] - avg;
    if (diff >= 10 && (!up || diff > up.diff)) up = { c, diff, avg };
  });
  if (up) h += `<p class="sub" style="margin-top:4px">En hausse : <b>${esc(up.c)}</b>, +${eur0(up.diff)} par rapport à ta moyenne des 3 mois précédents (${eur0(up.avg)}).</p>`;
  // Objectif d'épargne : revenus − dépenses hors virements d'épargne
  const t = tots[5], saved = t.rev - (t.dep - t.ep), goal = S.budget.saveGoal || 0;
  h += `<h3>Épargne du mois</h3>
    <div class="between" style="margin:0 0 7px;font-size:14px"><span>${eur(saved)}${goal ? ` / ${eur(goal)}` : ''}</span><label class="inl">Objectif <input type="text" inputmode="decimal" value="${goal ? numIn(goal) : ''}" placeholder="0 €" data-change="saveGoal" style="width:90px"></label></div>
    ${goal ? `<div class="bar ${saved < 0 ? 'over' : ''}"><span style="width:${Math.max(0, Math.min(100, saved / goal * 100))}%"></span></div>` : ''}
    <p class="sub">Revenus du mois − dépenses (les virements vers l’épargne comptent comme épargnés).</p>`;
  return h + `</section>`;
}

    <div class="row"><input type="file" accept=".csv,.txt,text/csv,text/plain" data-change="csvFile"></div>`;
  return h + `</section>`;
}

/* ---------- Import CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const head = text.split(/\r?\n/).slice(0, 20).join('\n');
  const d = [';', '\t', ',', '|'].reduce((b, c) => head.split(c).length > head.split(b).length ? c : b, ';');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.filter(Boolean).length >= 2);
}
function guessMap(h, data) {
  const n = h.map(norm), used = new Set();
  const find = (re, noDate) => { const i = n.findIndex((x, j) => re.test(x) && !used.has(j) && !(noDate && /date/.test(x))); if (i >= 0) used.add(i); return i; };
  const m = {};
  m.date = find(/date.*op|date de l.?op|date comptable/); if (m.date < 0) m.date = find(/date/);
  m.amount = find(/montant|amount|somme|valeur/, true);
  m.debit = m.amount < 0 ? find(/debit/, true) : -1;
  m.credit = m.amount < 0 ? find(/credit/, true) : -1;
  m.label = find(/libelle|descri|intitule|nature|detail|label|operation|beneficiaire/, true);
  const sample = data.slice(0, 25), cols = h.map((_, i) => i), half = sample.length / 2;
  if (m.date < 0) m.date = cols.find(i => sample.filter(r => parseDate(r[i])).length > half) ?? -1;
  if (m.amount < 0 && m.debit < 0 && m.credit < 0)
    m.amount = cols.find(i => i !== m.date && sample.filter(r => !isNaN(parseAmount(r[i])) && !parseDate(r[i])).length > half) ?? -1;
  if (m.label < 0) {
    let bi = -1, bl = 0;
    cols.forEach(i => { if ([m.date, m.amount, m.debit, m.credit].includes(i)) return; const l = sample.reduce((s, r) => s + (r[i] || '').length, 0); if (l > bl) { bl = l; bi = i; } });
    m.label = bi;
  }
  return m;
}
function csvRows() {
  const { data, map: m } = ui.csv, out = [];
  for (const r of data) {
    const date = parseDate(r[m.date]);
    if (!date) continue;
    let amt;
    if (m.amount >= 0) amt = parseAmount(r[m.amount]);
    else {
      const db = parseAmount(r[m.debit]), cr = parseAmount(r[m.credit]);
      if (isNaN(db) && isNaN(cr)) continue;
      amt = (isNaN(cr) ? 0 : Math.abs(cr)) - (isNaN(db) ? 0 : Math.abs(db));
    }
    if (isNaN(amt) || amt === 0) continue;
    out.push({ date, label: (r[m.label] || '').replace(/\s+/g, ' ').trim() || 'Opération', amount: round2(amt) });
  }
  return out;
}
function csvHTML() {
  const c = ui.csv;
  const opts = sel => `<option value="-1">—</option>` + c.header.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(h || 'Colonne ' + (i + 1))}</option>`).join('');
  const f = (field, lab) => `<label class="f">${lab}<select data-change="csvMap" data-field="${field}">${opts(c.map[field])}</select></label>`;
  const rows = csvRows();
  return `<p class="sub">${esc(c.name)} · ${plural(c.data.length, 'ligne')}. Vérifie les colonnes :</p>
    <div class="fg">${f('date', 'Date')}${f('label', 'Libellé')}${f('amount', 'Montant (avec signe)')}<span></span>${f('debit', 'ou colonne Débit')}${f('credit', 'et colonne Crédit')}</div>
    <p class="sub">Utilise soit « Montant », soit « Débit » + « Crédit » (mets « — » sur les autres).</p>
    ${rows.length ? `<div class="prev">${rows.slice(0, 4).map(r => `<div><span>${r.date.slice(8)}/${r.date.slice(5, 7)} · ${esc(r.label)}</span><b class="${r.amount > 0 ? 'pos' : ''}">${eur(r.amount)}</b></div>`).join('')}${rows.length > 4 ? `<div class="sub">… et ${rows.length - 4} autres</div>` : ''}</div>`
      : `<p class="sub todo">Aucune opération reconnue avec ces colonnes.</p>`}
    <div class="row"><button class="btn primary" data-click="csvImport" ${rows.length ? '' : 'disabled'}>Importer ${plural(rows.length, 'opération')}</button>
      <button class="btn" data-click="csvCancel">Annuler</button></div>`;
}
function readCSV(file) {
  const r = new FileReader();
  r.onload = () => {
    let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(r.result); }
    catch (e) { text = new TextDecoder('windows-1252').decode(r.result); }   // exports bancaires souvent en Latin-1
    const rows = parseCSV(text);
    if (rows.length < 2) { toast('Fichier vide ou illisible'); render(); return; }
    const hi = rows.findIndex(row => row.some(c => /date/i.test(c)) && !row.some(c => parseDate(c)));
    const header = hi < 0 ? rows[0].map((_, i) => 'Colonne ' + (i + 1)) : rows[hi];
    const data = hi < 0 ? rows : rows.slice(hi + 1);
    ui.csv = { name: file.name, header, data, map: guessMap(header, data) };
    render();
  };
  r.onerror = () => toast('Lecture du fichier impossible');
  r.readAsArrayBuffer(file);
}
function autoCat(label, amount) {
  if (amount > 0) return 'Revenus';
  const l = norm(label) + ' ';
  const names = new Set(S.budget.cats.map(c => c.name));
  for (const [re, c] of RULES) if (re.test(l) && names.has(c)) return c;
  return 'Autres';
}
function doImport() {
  const rows = csvRows();
  if (!rows.length) return;
  const sig = t => `${t.date}|${t.amount.toFixed(2)}|${norm(t.label)}`;
  const bag = new Map();
  S.budget.tx.forEach(t => { const s = t.bsig || sig(t); bag.set(s, (bag.get(s) || 0) + 1); });
  // Opérations saisies à la main pas encore rapprochées d'une ligne bancaire
  const manual = S.budget.tx.filter(t => t.src === 'm' && !t.bsig);
  let added = 0, dup = 0, matched = 0;
  for (const r of rows) {
    const s = sig(r);
    if (bag.get(s) > 0) { bag.set(s, bag.get(s) - 1); dup++; continue; }
    const mi = manual.findIndex(t => t.amount === r.amount && Math.abs(dayDiff(fromKey(t.date), fromKey(r.date))) <= 4);
    if (mi >= 0) { manual[mi].bsig = s; manual.splice(mi, 1); matched++; continue; }   // garde ta saisie (libellé, catégorie)
    S.budget.tx.push({ id: uid(), ...r, cat: autoCat(r.label, r.amount), src: 'csv' });
    added++;
  }
  if (added || matched) checkToday('argent');
  save();
  ui.csv = null;
  ui.month = rows.map(r => r.date).sort().pop().slice(0, 7);
  const parts = [`${plural(added, 'opération importée', 'opérations importées')}`];
  if (matched) parts.push(`${matched} déjà saisie${matched > 1 ? 's' : ''} à la main`);
  if (dup) parts.push(`${plural(dup, 'doublon ignoré', 'doublons ignorés')}`);
  toast(parts.join(' · '));
}

function renderHisto() {
  const t = today(), yAgo = addDays(t, -364);
  let active = 0, perfect = 0;
  for (let d = new Date(yAgo); d <= t; d = addDays(d, 1)) { const n = DOMAINS.filter(x => isDone(key(d), x.id)).length; if (n) active++; if (n === 5) perfect++; }
  const bestAll = Math.max(0, ...DOMAINS.map(d => best(d.id)));
  let h = `<section class="card"><div class="tiles">
      <div class="tile"><div class="v">${active}</div><div class="sub">jours actifs (12 mois)</div></div>
      <div class="tile"><div class="v">${perfect}</div><div class="sub">journées 5/5</div></div>
      <div class="tile"><div class="v">${bestAll} j</div><div class="sub">meilleure série</div></div></div></section>`;
  h += `<section class="card"><h2 style="margin-bottom:12px">L’année en un coup d’œil</h2>
    <div class="chips" style="margin-bottom:12px"><button class="chip ${ui.histDom === 'all' ? 'on' : ''}" data-click="histDom" data-d="all">Tous</button>${DOMAINS.map(d => `<button class="chip ${ui.histDom === d.id ? 'on' : ''}" data-click="histDom" data-d="${d.id}">${d.name}</button>`).join('')}</div>
    ${heatmap(ui.histDom)}</section>`;
  // Bilan mensuel
  const months = [...Array(6)].map((_, i) => shiftMonth(key(t).slice(0, 7), -i));
  const rows = months.map(m => {
    const first = fromKey(m + '-01'), last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    const end = last > t ? t : last, nd = dayDiff(end, first) + 1;
    const cnt = DOMAINS.map(d => { let c = 0; for (let x = new Date(first); x <= end; x = addDays(x, 1)) if (isDone(key(x), d.id)) c++; return c; });
    const pct = Math.round(cnt.reduce((s, c) => s + c, 0) / (nd * 5) * 100);
    return `<tr><td>${fmtMonth(m)}</td>${cnt.map(c => `<td>${c}</td>`).join('')}<td><b>${pct} %</b></td></tr>`;
  }).join('');
  h += `<section class="card"><h2 style="margin-bottom:8px">Bilan mensuel</h2><p class="sub" style="margin-bottom:8px">Nombre de jours cochés par domaine.</p>
    <table class="mt"><thead><tr><th>Mois</th>${DOMAINS.map(d => `<th title="${d.name}">${d.name.slice(0, 3)}.</th>`).join('')}<th>Total</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  // Par domaine

/* ---------- Sauvegarde ---------- */
async function exportData() {
  const name = `tableau-de-bord-${key(today())}.json`;
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  // Sur téléphone (surtout iPhone en mode appli), le téléchargement direct ne marche pas toujours :
  // on passe par le menu de partage (« Enregistrer dans Fichiers », Drive, e-mail…).
  if (/iphone|ipad|ipod|android/i.test(navigator.userAgent) && navigator.canShare) {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Sauvegarde du tableau de bord' }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d.checks !== 'object' || !d.budget) throw 0;
      if (!confirm('Remplacer les données actuelles par cette sauvegarde ?')) return;
      S = migrate(Object.assign(defaults(), d)); save(); render(); toast('Sauvegarde restaurée');
    } catch (e) { toast('Ce fichier n’est pas une sauvegarde valide'); }
  };
  r.readAsText(file);
}

  if (!d || !d.change) return;
  switch (d.change) {
    case 'today': setCheck(key(today()), d.dom, el.checked); if (el.checked) ui.pop = d.dom; save(); break;
    case 'goalCur': { const v = parseAmount(el.value); if (isNaN(v)) { toast('Valeur invalide'); break; } goalById(d.id).current = v; save(); break; }
    case 'goalDone': goalById(d.id).done = el.checked; save(); break;
    case 'ueVis': ueById(d.ue).hidden = !el.checked; save(); break;
    case 'cours': {
      const c = chapOf(d.ue, d.id), v = el.value;
      if (!c) break;
      // Pendant la frappe de l'année, le navigateur envoie 0002, 0020, 0202… : on attend une vraie année
      if (v && !/^20\d\d-/.test(v)) return;
      if (c.cours !== v) { c.cours = v; c.j = JDAYS.map(() => false); }
      save();
      // Saisie au clavier en cours : on redessine seulement en quittant le champ.
      // Date choisie dans le calendrier (téléphone, souris) : les rappels s'affichent tout de suite.
      if (document.activeElement === el && Date.now() - lastKey < 1500) return;
      render(); return;
    }
    case 'revUe': ui.revUe = el.value; ui.revChap = ''; setPref('revUe', el.value); setPref('revChap', ''); break;
    case 'revChap': ui.revChap = el.value; setPref('revChap', el.value); break;
    case 'pomoPreset': { const [w, b] = el.value.split('-').map(Number); S.pomo.work = w; S.pomo.brk = b; save(); break; }
    case 'txCat': S.budget.tx.find(t => t.id === d.id).cat = el.value; save(); break;
    case 'catBudget': { const v = parseAmount(el.value); S.budget.cats.find(c => c.name === d.name).budget = isNaN(v) ? 0 : Math.abs(v); save(); break; }
    case 'saveGoal': { const v = parseAmount(el.value); S.budget.saveGoal = isNaN(v) ? 0 : Math.abs(v); save(); break; }
    case 'txType': { const sel = el.form.elements.cat; if (el.value === 'rev') sel.value = 'Revenus'; else if (sel.value === 'Revenus') sel.value = 'Courses'; return; }
    case 'csvFile': if (el.files[0]) readCSV(el.files[0]); return;
    case 'csvMap': ui.csv.map[d.field] = +el.value; break;
    case 'bookRead': {
      const b = bookById(d.id), v = parseInt(el.value, 10);
      if (isNaN(v) || v < 0) break;
      if (v > (b.read || 0)) checkToday('culture');
      b.read = b.pages ? Math.min(v, b.pages) : v; save(); break;
    }
    case 'importFile': if (el.files[0]) importData(el.files[0]); el.value = ''; return;
    default: return;
  }
  if (el.matches('input[type=text], input[type=date], textarea')) renderSoon(); else render();
});

document.addEventListener('submit', e => {
  const f = e.target, a = f.dataset.form;
  if (!a) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const num = s => { const n = parseAmount(s); return isNaN(n) ? null : n; };
  switch (a) {
    case 'goal': {
      const title = (v.title || '').trim();
      if (!title) return;
      const start = num(v.start) ?? 0, target = num(v.target), current = num(v.current) ?? start;
      const data = { title, start, current, target, unit: (v.unit || '').trim(), deadline: v.deadline || '' };
      if (ui.editGoal) Object.assign(goalById(ui.editGoal), data);
      else S.goals.push({ id: uid(), done: false, created: key(today()), ...data });
      ui.editGoal = null; ui.goalForm = false; save(); toast('Objectif enregistré');
      break;
    }
    case 'chapAdd': {
      const names = (v.names || '').split('\n').map(s => s.replace(/^\s*[-•*]\s*/, '').trim()).filter(Boolean);
      if (!names.length) return;
      const u = ueById(f.dataset.ue);
      names.forEach(n => u.chapters.push(newChapter(n)));
      ui.openUE.add(u.id); save();
      break;
    }
    case 'tx': {
      const amt = parseAmount(v.amount);
      if (isNaN(amt) || amt === 0) { toast('Montant invalide'); return; }
      const date = v.date || key(today());
      S.budget.tx.push({ id: uid(), date, label: (v.label || '').trim() || (v.type === 'rev' ? 'Revenu' : 'Dépense'),
        amount: round2(Math.abs(amt) * (v.type === 'rev' ? 1 : -1)), cat: v.cat || 'Autres', src: 'm' });
      const was = isDone(key(today()), 'argent');
      checkToday('argent');
      ui.month = date.slice(0, 7);
      save(); toast(was ? 'Opération ajoutée' : 'Opération ajoutée · « Argent » coché');
      break;
    }
    case 'catAdd': {
      const n = (v.name || '').trim();
      if (!n) return;
      if (S.budget.cats.some(c => c.name.toLowerCase() === n.toLowerCase())) { toast('Cette catégorie existe déjà'); return; }
      const ri = S.budget.cats.findIndex(c => c.name === 'Revenus');
      S.budget.cats.splice(ri < 0 ? S.budget.cats.length : ri, 0, { name: n, budget: 0 });
      save();
      break;
    }
    case 'chess': {
      const user = (v.user || '').trim().replace(/^@/, '');
      if (!user) return;
      if (user !== S.chess.user || v.site !== S.chess.site) Object.assign(S.chess, { hist: [], now: null, last: 0, err: '' });
      Object.assign(S.chess, { site: v.site, user, main: v.main });
      ui.chessEdit = false; ui.chessAutoAt = 0; save(); fetchChess(true).then(chessAuto);
      break;
    }
    case 'sync': {
      const repo = (v.repo || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
      const token = (v.token || '').trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast('Indique le dépôt sous la forme pseudo/nom-du-depot'); return; }
      if (!token) { toast('Colle la clé GitHub'); return; }
      sync = { on: false, repo, token, sha: '', syncedAt: 0, last: 0, err: '' };
      toast('Connexion à GitHub…');
      (async () => {
        try {
          const r = await ghFetch('');
          if (!r.ok) throw new Error(ghError(r.status));
          if (!(await r.json()).private) throw new Error('Ce dépôt est public : tes données seraient visibles par tout le monde. Rends-le privé (Settings → Danger Zone → Change visibility), puis réessaie.');
          sync.on = true; saveSync();
          await syncNow();
          toast(sync.err ? sync.err : 'Synchro activée ✓');
        } catch (e) {
          sync.err = e instanceof TypeError ? 'Connexion à GitHub impossible — vérifie ta connexion internet.' : e.message;
          sync.token = ''; saveSync();
        }
        render();
      })();
      return;
    }
    case 'review': {
      const wk = f.dataset.w;
      S.reviews[wk] = { good: (v.good || '').trim(), hard: (v.hard || '').trim(), next: (v.next || '').trim(), mood: +v.mood || 0, at: key(today()) };
      ui.reviewWeek = wk; save(); toast('Bilan enregistré');
      break;
    }
    case 'book': {
      const title = (v.title || '').trim();
      if (!title) return;
      const pages = parseInt(v.pages, 10) || 0;
      const data = { title, author: (v.author || '').trim(), pages, status: v.status, link: (v.link || '').trim() };
      const b = ui.editBook ? bookById(ui.editBook) : { id: uid(), read: 0, rating: 0, start: '', end: '' };
      if (data.status !== 'todo' && !b.start) b.start = key(today());
      if (data.status === 'done' && b.status !== 'done') { b.end = key(today()); if (pages) b.read = pages; checkToday('culture'); }
      if (data.status !== 'done') b.end = '';
      Object.assign(b, data);
      if (pages && b.read > pages) b.read = pages;
      if (!ui.editBook) S.books.push(b);
      ui.editBook = null; ui.bookForm = false; save(); toast('Livre enregistré');
      break;
    }
  }
  render();
});

// Infobulles des graphiques (survol à la souris, toucher sur téléphone)
function showTip(e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) return;
  const chart = el.closest('.chart');
  if (!chart) return;
  chart.querySelector('.tip').textContent = el.dataset.tip;
  const dot = chart.querySelector('.hdot');
  if (dot && el.dataset.cx) { dot.setAttribute('cx', el.dataset.cx); dot.setAttribute('cy', el.dataset.cy); }
}
document.addEventListener('pointerover', showTip);
document.addEventListener('pointerdown', showTip);

// Mémorise les blocs ouverts / fermés
document.addEventListener('toggle', e => {
  const el = e.target;
  if (el.id === 'weekCard') { ui.weekOpen = el.open; setPref('weekOpen', el.open ? '1' : '0'); }
  else if (el.classList && el.classList.contains('ue') && el.dataset.ue) el.open ? ui.openUE.add(el.dataset.ue) : ui.openUE.delete(el.dataset.ue);
  else if (el.id === 'goalForm') { ui.goalForm = el.open; if (!el.open && ui.editGoal) { ui.editGoal = null; render(); } }
  else if (el.id === 'bookForm') { ui.bookForm = el.open; if (!el.open && ui.editBook) { ui.editBook = null; render(); } }
}, true);

// Raccourcis clavier (PC) : 1 à 5 cochent les domaines du jour sur l'accueil
document.addEventListener('keydown', e => {
  if (ui.tab !== 'today' || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement;
  if (a && a.matches('input, textarea, select')) return;
  const i = '12345'.indexOf(e.key);
  if (i < 0) return;
  const dom = DOMAINS[i].id, k = key(today()), on = !isDone(k, dom);
  setCheck(k, dom, on); if (on) ui.pop = dom; save(); render();
  toast(`${DOMAINS[i].name} ${on ? 'coché' : 'décoché'}`);
});

// Retour sur la page : nouveau jour éventuel, minuteur à jour, échecs et synchro
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  tick(); chessAuto(); syncNow();
});
window.addEventListener('online', () => syncNow());

// Page ouverte dans deux onglets (ou navigateur + appli) : on reprend les données de l'autre
// au lieu de les écraser avec une version périmée.
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { S = migrate(Object.assign(defaults(), JSON.parse(e.newValue))); render(); } catch (err) {}
});

// Appli installable et hors ligne (uniquement une fois en ligne, en https)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.install = e; if (ui.tab === 'plus' && ui.plus === 'data') render(); });

setInterval(tick, 1000);
render();
if (S.chess.user && Date.now() - S.chess.last > 6 * 36e5) fetchChess();
chessAuto();
syncNow();
})();
</script>
</body>
</html>
