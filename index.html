<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0b1f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Level Up">
<title>Level Up · Aaron</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<nav class="tabs" aria-label="Sections">
  <div class="brand"><span class="brand-logo">⚡</span>Level Up</div>
  <button data-act="tab" data-tab="today"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span>Aujourd’hui</span></button>
  <button data-act="tab" data-tab="stats"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></button>
  <button data-act="tab" data-tab="game" class="nav-game"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M7.5 12.5h4M9.5 10.5v4M15.5 11.5h.01M17.5 13.5h.01"/></svg><span>Jeu</span></button>
  <button data-act="tab" data-tab="goals"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".7"/></svg><span>Objectifs</span></button>
  <button data-act="tab" data-tab="media" class="d-only"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span>Médiathèque</span></button>
  <button data-act="tab" data-tab="growth" class="d-only"><svg class="ico" viewBox="0 0 24 24"><path d="M12 21v-9M12 12C12 7 8 4 4 4c0 5 3 8 8 8zM12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/></svg><span>Progrès</span></button>
  <button data-act="tab" data-tab="vision" class="d-only"><svg class="ico" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Ma vision</span></button>
  <button data-act="tab" data-tab="settings" class="d-only"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span>Réglages</span></button>
  <button data-act="tab" data-tab="more" class="m-only"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg><span>Plus</span></button>
</nav>
<main id="app"></main>
<div id="sheet" class="sheet-root" hidden></div>
<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Active JavaScript pour utiliser le tableau de bord.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
